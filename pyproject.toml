[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "pyaudiocast"
dynamic = ["version"]
description = "Cross-platform audio output for Python, powered by Rust and CPAL"
requires-python = ">=3.8"
license = { text = "MIT" }

[project.optional-dependencies]
numpy = ["numpy"]
dev = ["pytest", "numpy"]

[tool.maturin]
module-name = "pyaudiocast._pyaudiocast"
features = ["pyo3/extension-module"]
