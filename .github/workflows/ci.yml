name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # python3-dev: unit tests link against libpython
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev python3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: dtolnay/rust-toolchain@1.88

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --locked

  python:
    name: Python ${{ matrix.python-version }} tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 24.04: there's no Python 3.9 build for ubuntu-latest (26.04).
        os: [ubuntu-24.04, macos-latest, windows-latest]
        # abi3 wheel: the oldest supported Python and the newest ones
        python-version: ["3.9", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pulseaudio libasound2-plugins

      # A headless sound server with a null sink, so the audio tests run instead of skipping.
      - name: Start a headless sound server (Linux)
        if: runner.os == 'Linux'
        run: |
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-$RUNNER_TEMP/xdg}"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          printf 'pcm.!default pulse\nctl.!default pulse\n' > ~/.asoundrc
          if pulseaudio --start --exit-idle-time=-1; then
            pactl unload-module module-suspend-on-idle || true
            pactl info
          else
            echo "::warning::No sound server: audio tests will be skipped"
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtualenv and install dependencies
        run: |
          python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/pip install maturin numpy pytest pytest-cov
        shell: bash
        if: runner.os != 'Windows'

      - name: Install dependencies (Windows)
        run: |
          .venv\Scripts\pip install maturin numpy pytest pytest-cov
        shell: cmd
        if: runner.os == 'Windows'

      - name: Build and install
        run: |
          source .venv/bin/activate
          maturin develop
        shell: bash
        if: runner.os != 'Windows'

      - name: Build and install (Windows)
        run: |
          .venv\Scripts\activate && maturin develop
        shell: cmd
        if: runner.os == 'Windows'

      # TEMPORARY: does the default macOS device keep time, with this branch (cpal 0.18) and
      # with PyPI 0.1.10 (cpal 0.17)?
      - uses: actions/setup-python@v7
        if: runner.os == 'macOS'
        id: py312
        with:
          python-version: "3.12"
          update-environment: false
      - name: Audio pace probe (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          cat > /tmp/pace.py <<'EOF'
          import sys, time, numpy as np, pyaudiocast as pc
          def pace():
              with pc.AudioPlayer() as p:
                  z = np.zeros(int(p.sample_rate * 0.05) * p.channels, np.float32)
                  p.write(z)
                  p.drain()
                  p.write(z)
                  t = time.monotonic()
                  p.drain()
                  return time.monotonic() - t
          times = []
          end = time.monotonic() + 60
          while time.monotonic() < end:
              times.append(pace())
              time.sleep(0.5)
          slow = [round(t, 2) for t in times if t > 0.5]
          print(sys.argv[1], f"{len(times)} streams, {len(slow)} slow: {slow}", flush=True)
          EOF
          ${{ steps.py312.outputs.python-path }} -m venv /tmp/old
          /tmp/old/bin/pip install -q pyaudiocast==0.1.10 numpy
          (cd /tmp && /tmp/old/bin/python pace.py "0.1.10 (cpal 0.17):")
          .venv/bin/python /tmp/pace.py "this branch (cpal 0.18):"
          (cd /tmp && /tmp/old/bin/python pace.py "0.1.10 (cpal 0.17):")

      - name: Run tests with coverage
        run: |
          source .venv/bin/activate
          pytest tests/ -v --tb=short --cov=pyaudiocast --cov-report=xml
        shell: bash
        if: runner.os != 'Windows'

      - name: Run tests with coverage (Windows)
        run: |
          .venv\Scripts\activate && pytest tests/ -v --tb=short --cov=pyaudiocast --cov-report=xml
        shell: cmd
        if: runner.os == 'Windows'

      - name: Upload coverage to Codecov
        if: runner.os == 'Linux' && matrix.python-version == '3.14'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
