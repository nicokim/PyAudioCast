name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # python3-dev: unit tests link against libpython
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev python3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: dtolnay/rust-toolchain@1.88

      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --locked

  python:
    name: Python ${{ matrix.python-version }} tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 24.04: there's no Python 3.9 build for ubuntu-latest (26.04).
        os: [ubuntu-24.04, macos-latest, windows-latest]
        # abi3 wheel: the oldest supported Python and the newest ones
        python-version: ["3.9", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pulseaudio libasound2-plugins

      # A headless sound server with a null sink, so the audio tests run instead of skipping.
      - name: Start a headless sound server (Linux)
        if: runner.os == 'Linux'
        run: |
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-$RUNNER_TEMP/xdg}"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          mkdir -p -m 700 "$XDG_RUNTIME_DIR"
          printf 'pcm.!default pulse\nctl.!default pulse\n' > ~/.asoundrc
          if pulseaudio --start --exit-idle-time=-1; then
            pactl unload-module module-suspend-on-idle || true
            pactl info
          else
            echo "::warning::No sound server: audio tests will be skipped"
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtualenv and install dependencies
        run: |
          python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/pip install maturin numpy pytest pytest-cov
        shell: bash
        if: runner.os != 'Windows'

      - name: Install dependencies (Windows)
        run: |
          .venv\Scripts\pip install maturin numpy pytest pytest-cov
        shell: cmd
        if: runner.os == 'Windows'

      - name: Build and install
        run: |
          source .venv/bin/activate
          maturin develop
        shell: bash
        if: runner.os != 'Windows'

      - name: Build and install (Windows)
        run: |
          .venv\Scripts\activate && maturin develop
        shell: cmd
        if: runner.os == 'Windows'

      # TEMPORARY: how well each macOS output device keeps time.
      - name: Audio pace probe (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          system_profiler SPAudioDataType
          .venv/bin/python - <<'EOF'
          import time, numpy as np, pyaudiocast as pc
          print([d["name"] for d in pc.list_output_devices()])
          end = time.monotonic() + 60
          while time.monotonic() < end:
              for dev in (None, "Null Audio Device"):
                  try:
                      with pc.AudioPlayer(device=dev) as p:
                          p.write(np.zeros(int(p.sample_rate * 0.2) * p.channels, np.float32))
                          t = time.monotonic()
                          p.drain()
                          print(dev, p.device_sample_rate, p.device_channels,
                                f"0.2 s -> {time.monotonic() - t:.2f} s", flush=True)
                  except Exception as e:
                      print(dev, "failed:", e, flush=True)
          EOF

      - name: Run tests with coverage
        run: |
          source .venv/bin/activate
          pytest tests/ -v --tb=short --cov=pyaudiocast --cov-report=xml
        shell: bash
        if: runner.os != 'Windows'

      - name: Run tests with coverage (Windows)
        run: |
          .venv\Scripts\activate && pytest tests/ -v --tb=short --cov=pyaudiocast --cov-report=xml
        shell: cmd
        if: runner.os == 'Windows'

      - name: Upload coverage to Codecov
        if: runner.os == 'Linux' && matrix.python-version == '3.14'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
