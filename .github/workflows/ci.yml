name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

  python:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtualenv and install dependencies
        run: |
          python -m venv .venv

      - name: Install dependencies
        run: |
          .venv/bin/pip install maturin numpy pytest
        shell: bash
        if: runner.os != 'Windows'

      - name: Install dependencies (Windows)
        run: |
          .venv\Scripts\pip install maturin numpy pytest
        shell: cmd
        if: runner.os == 'Windows'

      - name: Build and install
        run: |
          source .venv/bin/activate
          maturin develop
        shell: bash
        if: runner.os != 'Windows'

      - name: Build and install (Windows)
        run: |
          .venv\Scripts\activate && maturin develop
        shell: cmd
        if: runner.os == 'Windows'

      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest tests/ -v --tb=short || echo "::warning::Some tests failed (expected in CI without audio hardware)"
        shell: bash
        if: runner.os != 'Windows'

      - name: Run tests (Windows)
        run: |
          .venv\Scripts\activate && pytest tests/ -v --tb=short
        shell: cmd
        if: runner.os == 'Windows'
